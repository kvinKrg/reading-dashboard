<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Margins — Reading Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #141311;
  --bg-elevated: #1c1a17;
  --bg-hover: #221f1c;
  --border: #2c2824;
  --border-light: #3a3530;
  --text: #e8e3db;
  --text-muted: #a09888;
  --text-dim: #6b655c;
  --accent: #c9a96e;
  --accent-dim: #8a7348;
  --accent-bg: rgba(201, 169, 110, 0.08);
  --green: #6b9e6b;
  --green-bg: rgba(107, 158, 107, 0.12);
  --red: #b06c6c;
  --red-bg: rgba(176, 108, 108, 0.12);
  --orange: #c08550;
  --orange-bg: rgba(192, 133, 80, 0.12);
  --blue: #6b85b0;
  --blue-bg: rgba(107, 133, 176, 0.12);
  --pink: #b08aa0;
  --pink-bg: rgba(176, 138, 160, 0.12);
  --star: #e8c547;
  --teal: #5b9c92;
  --slate: #7580a0;
  --rust: #a15c4a;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

body {
  padding: 0;
  min-height: 100vh;
}

/* App chrome */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.top-bar {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--bg);
  letter-spacing: -0.5px;
}

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  font-size: 16px;
}
.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
  border-color: var(--border-light);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar { height: 0; }

.tab {
  padding: 14px 16px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: inherit;
}
.tab:hover { color: var(--text-muted); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab .count {
  font-size: 11px;
  font-weight: 500;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 22px;
  text-align: center;
}
.tab.active .count {
  background: var(--accent-bg);
  border-color: var(--accent-dim);
  color: var(--accent);
}

.tab-dots {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}

/* Content */
.content {
  flex: 1;
  padding: 24px 20px 80px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Home panel */
.home-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 14px 14px;
  text-align: center;
}
.stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.stat-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 6px;
}

.stat-card.accent .stat-value { color: var(--accent); }

/* Section headings */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.2px;
}

.section-meta {
  font-size: 12px;
  color: var(--text-dim);
}

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* Book list */
.book-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.book-item {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s;
  border: 1px solid transparent;
}
.book-item:hover {
  background: var(--bg-elevated);
}
.book-item.selected {
  background: var(--accent-bg);
  border-color: var(--accent-dim);
}

.book-main {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}

.book-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.2px;
  line-height: 1.3;
}
.book-authors {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}

.book-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
}

.book-series {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
}

.book-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.book-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.book-badge.ongoing { background: var(--blue-bg); color: var(--blue); }
.book-badge.finished { background: var(--green-bg); color: var(--green); }
.book-badge.dropped { background: var(--red-bg); color: var(--red); }
.book-badge.paused { background: var(--orange-bg); color: var(--orange); }
.book-badge.priority-1 { background: var(--accent-bg); color: var(--accent); }
.book-badge.priority-2 { background: var(--pink-bg); color: var(--pink); }
.book-badge.priority-3 { background: var(--blue-bg); color: var(--blue); }
.book-badge.backburner { background: var(--text-dim); color: var(--text); opacity: 0.6; }
.book-badge.waiting { background: var(--orange-bg); color: var(--orange); }
.book-badge.reading { background: var(--blue-bg); color: var(--blue); }

.rating-stars {
  display: flex;
  gap: 2px;
  cursor: pointer;
}
.star {
  font-size: 13px;
  line-height: 1;
  color: var(--border);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: var(--border);
  transition: all 0.1s ease;
  user-select: none;
}
.star.half {
  background: linear-gradient(90deg, var(--star) 50%, var(--border) 50%);
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.star.full {
  color: var(--star);
  -webkit-text-fill-color: var(--star);
  background: none;
}

/* Reading log grouping */
.series-header {
  margin-top: 20px;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.series-header.standalone {
  border-bottom: 1px dashed var(--border);
}
.series-name-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.series-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.2px;
}
.series-header.standalone .series-name {
  font-style: italic;
  color: var(--text-dim);
  font-weight: 500;
}
.series-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-dim);
}
.series-count {
  font-weight: 500;
}
.series-avg {
  color: var(--accent);
  font-weight: 500;
}
.series-avg::before {
  content: "\2605 ";
}

.tier-row {
  margin: 2px 0 4px 8px;
  padding-left: 12px;
  border-left: 2px solid var(--border);
}
.tier-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 2px;
}
.tier-row[data-tier="5"] .tier-label,
.tier-row[data-tier="4.5"] .tier-label,
.tier-row[data-tier="4"] .tier-label { color: var(--star); }
.tier-row[data-tier="3.5"] .tier-label,
.tier-row[data-tier="3"] .tier-label { color: var(--text-dim); }
.tier-row[data-tier="0"] .tier-label { color: var(--text-dim); opacity: 0.5; }
.tier-books {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.book-date {
  font-size: 12px;
  color: var(--text-dim);
}

.book-booknum {
  font-size: 12px;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-chip {
  padding: 5px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.12s;
  font-family: inherit;
}
.filter-chip:hover { color: var(--text); border-color: var(--border-light); }
.filter-chip.active {
  background: var(--accent-bg);
  border-color: var(--accent-dim);
  color: var(--accent);
}

/* Add book panel */
.add-panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}

.add-panel h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 14px;
  letter-spacing: -0.2px;
}

.form-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  align-items: center;
}
.form-row.single { justify-content: center; }
.form-field {
  flex: 1;
  min-width: 0;
}
.form-field.wide { flex: 2; }
.form-field.narrow { flex: 0.8; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.12s;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--accent-dim);
}
input::placeholder { color: var(--text-dim); opacity: 0.6; }

.form-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.12s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.btn-primary:hover { background: #b89a5e; }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary {
  background: transparent;
  border-color: var(--border);
  color: var(--text-muted);
}
.btn-secondary:hover { color: var(--text); border-color: var(--border-light); }
.btn-danger {
  background: transparent;
  border-color: var(--red);
  color: var(--red);
}
.btn-danger:hover { background: var(--red-bg); }

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
  display: flex;
  justify-content: space-around;
  z-index: 20;
  backdrop-filter: blur(12px);
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--text-dim);
  transition: color 0.12s;
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  min-width: 60px;
}
.bottom-nav-item:hover { color: var(--text-muted); }
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item .nav-icon {
  font-size: 20px;
  line-height: 1;
}

/* Desktop bottom nav hidden */
@media (min-width: 768px) {
  .bottom-nav { display: none; }
  .content { max-width: 800px; }
  .top-bar { padding: 18px 28px 14px; }
  .tabs { padding: 0 28px; }
  .book-authors { max-width: 220px; }
}

@media (min-width: 1024px) {
  .content { max-width: 900px; padding: 32px 28px 100px; }
}

/* Priority color map */
.pcolor-1 { color: var(--accent); }
.pcolor-2 { color: var(--pink); }
.pcolor-3 { color: var(--blue); }

/* Entry animation */
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.book-item {
  animation: fadeSlide 0.2s ease forwards;
}
.book-item:nth-child(1) { animation-delay: 0.01s; }
.book-item:nth-child(2) { animation-delay: 0.02s; }
.book-item:nth-child(3) { animation-delay: 0.03s; }
.book-item:nth-child(4) { animation-delay: 0.04s; }
.book-item:nth-child(5) { animation-delay: 0.05s; }
.book-item:nth-child(6) { animation-delay: 0.06s; }
.book-item:nth-child(7) { animation-delay: 0.07s; }
.book-item:nth-child(8) { animation-delay: 0.08s; }
.book-item:nth-child(9) { animation-delay: 0.09s; }
.book-item:nth-child(10) { animation-delay: 0.10s; }

.loading {
  padding: 40px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
}

.hidden { display: none !important; }

/* Status color for star rating display */
.status-line {
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>
<body>
<div class="app">

<div class="top-bar">
  <div class="brand">
    <div class="brand-mark">M</div>
    <span class="brand-name">Margins</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="syncBtn" title="Sync data from cloud">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.5 2 9 9Z"/><path d="m9 12 3-3-1.5-1.5"/><path d="M12 9v3l1.5-1.5"/></svg>
    </button>
    <button class="icon-btn" id="exportBtn" title="Export data as JSON">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="home">Home</button>
  <button class="tab" data-tab="log">Reading Log <span class="count" id="logCount">0</span></button>
  <button class="tab" data-tab="tbr">TBR <span class="count" id="tbrCount">0</span></button>
</div>

<div class="content">

  <!-- HOME -->
  <div class="tab-panel active" id="panel-home">
    <div class="home-stats" id="homeStats"></div>
    <div id="homeContent"></div>
  </div>

  <!-- READING LOG -->
  <div class="tab-panel" id="panel-log">
    <div class="filter-bar" id="logFilters"></div>
    <div id="logContent"></div>
  </div>

  <!-- TBR -->
  <div class="tab-panel" id="panel-tbr">
    <div class="filter-bar" id="tbrFilters"></div>
    <div id="tbrContent"></div>
  </div>

</div>

<!-- Add book panel (shown inline when adding) -->
<div class="add-panel hidden" id="addPanel">
  <h3>Add a Book</h3>
  <div class="form-row">
    <div class="form-field wide">
      <label class="form-label">Title</label>
      <input type="text" id="addTitle" placeholder="Book title" autocomplete="off">
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label class="form-label">Author</label>
      <input type="text" id="addAuthor" placeholder="Author" autocomplete="off">
    </div>
    <div class="form-field">
      <label class="form-label">Series</label>
      <input type="text" id="addSeries" placeholder="Series (optional)" autocomplete="off">
    </div>
    <div class="form-field narrow">
      <label class="form-label">Book #</label>
      <input type="number" id="addBookNum" placeholder="#" min="1">
    </div>
  </div>
  <div class="form-row" id="ratingRow">
    <div class="form-field">
      <label class="form-label">Rating</label>
      <div class="status-line" id="ratingStars">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>
      <input type="hidden" id="addRating" value="">
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label class="form-label">Status</label>
      <select id="addStatus">
        <option value="Ongoing">Ongoing</option>
        <option value="Finished">Finished</option>
        <option value="Dropped">Dropped</option>
        <option value="Paused">Paused</option>
        <option value="Currently Reading">Currently Reading</option>
      </select>
    </div>
    <div class="form-field">
      <label class="form-label">Date Read</label>
      <input type="date" id="addDate">
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label class="form-label">TBR Priority</label>
      <select id="addPriority">
        <option value="">—</option>
        <option value="Priority 1">Priority 1</option>
        <option value="Priority 2">Priority 2</option>
        <option value="Priority 3">Priority 3</option>
        <option value="Backburner">Backburner</option>
        <option value="Waiting for Release">Waiting for Release</option>
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" id="saveBookBtn">Add Book</button>
    <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
    <button class="btn btn-danger hidden" id="deleteBookBtn">Delete</button>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
// ⚠️ GitHub PAT is NOT stored in this file.
//    On first open, paste your PAT in the settings panel (gear icon, top-right).
//    It's stored in your browser's localStorage — never leaves your device.
//    Revoke/regenerate at github.com/settings/tokens if the HTML file is ever shared.
//
//    To change the repo, edit GH_USER and GH_REPO below.

const GH_USER  = "kvinKrg";
const GH_REPO  = "reading-dashboard";
const GH_API   = `https://api.github.com/repos/${GH_USER}/${GH_REPO}`;
const DATA_URL = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/data.json`;

// Token loaded from localStorage (set via settings panel first time)
function getToken() {
  return localStorage.getItem("rd_token") || "";
}
function setToken(t) {
  if (t) localStorage.setItem("rd_token", t);
  else localStorage.removeItem("rd_token");
}

// ── State ───────────────────────────────────────────────────────────────────
let data = { readingLog: [], tbr: [] };
let currentTab = "home";
let logFilter = "all";
let tbrFilter = "all";
let homeFilter = "all";
let editingMode = null; // "add" | "edit-log" | "edit-tbr"
let editingBook = null;  // the full book object being edited
let editingBookKey = null; // "readingLog" | "tbr" — which array it lives in

// ── Helpers ──────────────────────────────────────────────────────────────────
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

// SVG icons used in the reference layout
const CHEVRON = `<svg class="chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const EDIT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

// Escape HTML entities
function esc(v){ return String(v||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

// Star row for tier display (matches reference SVG stars)
function starRow(rating){
  const full = Math.floor(rating);
  const half = rating % 1 !== 0;
  const outline = 5 - full - (half ? 1 : 0);
  let html = '';
  for(let i=0;i<full;i++) html += `<svg viewBox="0 0 24 24"><use href="#starPath" fill="currentColor"/></svg>`;
  if(half) html += `<svg viewBox="0 0 24 24"><defs><clipPath id="hc${rating}"><rect x="0" y="0" width="12" height="24"/></clipPath></defs><use href="#starPath" fill="none" stroke="currentColor" stroke-width="1.3"/><use href="#starPath" fill="currentColor" clip-path="url(#hc${rating})"/></svg>`;
  for(let i=0;i<outline;i++) html += `<svg class="outline" viewBox="0 0 24 24"><use href="#starPath" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
  return html;
}

// Rating label for tier display
function ratingLabel(r){ return Number.isInteger(r) ? `${r}.0` : `${r}`; }

// Status dot class (matches reference: finished=gold, ongoing=teal, paused=slate, dropped=rust)
function statusDot(s){ return s.toLowerCase(); }

// Status label with capital first letter
function statusLabel(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

// Render progress dots for a series (matches reference layout)
function renderProgressDots(status, current, total){
  if(!total){
    let dots = '';
    for(let i=0;i<current;i++) dots += `<span class="dot filled-${status}"></span>`;
    dots += `<span class="dot unknown"></span>`;
    return `<div class="progress"><div class="dots">${dots}</div></div>`;
  }
  let dots = '';
  for(let i=0;i<total;i++){
    dots += `<span class="dot ${i < current ? 'filled-'+status : ''}"></span>`;
  }
  return `<div class="progress"><div class="dots">${dots}</div></div>`;
}

function statusBadgeHTML(status) {
  const cls = {
    "Ongoing": "ongoing",
    "Finished": "finished",
    "Dropped": "dropped",
    "Paused": "paused",
    "Currently Reading": "reading",
    "Priority 1": "priority-1",
    "Priority 2": "priority-2",
    "Priority 3": "priority-3",
    "Backburner": "backburner",
    "Waiting for Release": "waiting",
  }[status] || "";
  return `<span class="book-badge ${cls}">${status}</span>`;
}

function starRating(rating, size=13) {
  if (!rating) return "";
  let s = "";
  for (let i = 1; i <= 5; i++) {
    let cls = "star";
    if (rating >= i) cls += " full";
    else if (rating >= i - 0.5) cls += " half";
    s += `<span class="${cls}" data-v="${i}" style="font-size:${size}px">★</span>`;
  }
  return `<span class="rating-stars">${s}</span>`;
}

function bookEntryHTML(b, isTBR=false) {
  const seriesPart = b.series ? `<span class="book-series">${b.series}${b.bookNumber ? ` #${b.bookNumber}` : ""}</span>` : "";
  const datePart = b.dateRead ? `<span class="book-date">${b.dateRead}</span>` : "";
  const ratingPart = b.rating ? starRating(b.rating, 12) : "";

  if (isTBR) {
    const pColor = {
      "Priority 1": "pcolor-1",
      "Priority 2": "pcolor-2",
      "Priority 3": "pcolor-3",
      "Backburner": "",
      "Waiting for Release": "pcolor-3",
      "Currently Reading": "pcolor-1",
    }[b.tbrPriority || b.status || ""] || "";
    const pCls = "book-badge" + (b.tbrPriority || b.status || "").replace(/\s/g, "-").toLowerCase();
    return `
      <div class="book-item" data-id="${b.title}|${b.author}|${b.series || ""}|${b.tbrPriority || b.status || ""}|tbr">
        <div class="book-main">
          <div class="book-title">${b.title}</div>
          <div class="book-authors">${b.author}</div>
        </div>
        ${seriesPart ? `<div class="book-sub">${seriesPart}</div>` : ""}
        <div class="book-meta">
          ${ratingPart}
          <span class="book-badge ${pCls} ${pColor}">${b.tbrPriority || b.status || "Priority 1"}</span>
        </div>
      </div>`;
  }

  return `
    <div class="book-item" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}">
      <div class="book-main">
        <div class="book-title">${b.title}</div>
        <div class="book-authors">${b.author}</div>
      </div>
      ${seriesPart ? `<div class="book-sub">${seriesPart}</div>` : ""}
      <div class="book-meta">
        ${ratingPart}
        ${datePart}
        ${statusBadgeHTML(b.status)}
      </div>
    </div>`;
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderHome() {
  const log = data.readingLog;
  const tbr = data.tbr;

  // Compute the overall average rating (for display at top of Home)
  const ratedBooks = log.filter(b => b.rating != null);
  const overallAvg = ratedBooks.length ? (ratedBooks.reduce((s, b) => s + b.rating, 0) / ratedBooks.length) : null;

  // Build groups: series → tier → series entries; standalones → tier → standalone entries
  const seriesGroups = {};
  const standaloneGroups = {};

  for (const b of log) {
    const tier = b.rating != null ? Math.round(b.rating * 2) / 2 : 0; // round to nearest 0.5
    if (b.series) {
      if (!seriesGroups[tier]) seriesGroups[tier] = {};
      if (!seriesGroups[tier][b.series]) {
        seriesGroups[tier][b.series] = { name: b.series, books: [], status: null, total: null };
      }
      seriesGroups[tier][b.series].books.push(b);
      if (!seriesGroups[tier][b.series].total) {
        // Try to infer total from the data (max book number seen)
        const maxNum = Math.max(...seriesGroups[tier][b.series].books.map(x => x.bookNumber || 0));
        seriesGroups[tier][b.series].total = maxNum > 0 ? maxNum : null;
      }
    } else {
      if (!standaloneGroups[tier]) standaloneGroups[tier] = [];
      standaloneGroups[tier].push(b);
    }
  }

  // Compute series status and average
  const allTiers = new Set([...Object.keys(seriesGroups).map(Number), ...Object.keys(standaloneGroups).map(Number), 0]);
  const sortedTiers = [...allTiers].sort((a, b) => b - a).filter(t => t > 0);

  // Derive series status from book statuses
  for (const tier of sortedTiers) {
    if (!seriesGroups[tier]) continue;
    for (const [name, s] of Object.entries(seriesGroups[tier])) {
      const statuses = s.books.map(b => b.status);
      const hasOngoing = statuses.includes("Ongoing") || statuses.includes("Currently Reading");
      const hasFinished = statuses.includes("Finished");
      const hasDropped = statuses.includes("Dropped");
      const hasPaused = statuses.includes("Paused");
      if (hasDropped) s.status = "Dropped";
      else if (hasOngoing) s.status = "Ongoing";
      else if (hasPaused) s.status = "Paused";
      else if (hasFinished && s.books.every(b => b.status === "Finished")) s.status = "Finished";
      else if (hasFinished) s.status = "Ongoing";
      else s.status = "Ongoing";

      // Series average (only rated books)
      const rated = s.books.filter(b => b.rating != null);
      s.avg = rated.length ? (rated.reduce((sum, b) => sum + b.rating, 0) / rated.length) : null;
    }
  }

  // Home content: filter pills + tier sections (no stats, no lede)
  let html = "";

  // Filter pills
  const statuses = ["all", "Ongoing", "Finished", "Dropped", "Paused"];
  html += `<div class="filter-bar" id="homeFilters">`;
  html += statuses.map(s =>
    `<button class="filter-chip ${currentTab === "home" && homeFilter === s ? "active" : ""}" data-filter="${s}">${s === "all" ? "All" : s}</button>`
  ).join("");
  html += `</div>`;

  // Tier sections
  for (const tier of sortedTiers) {
    const seriesEntries = seriesGroups[tier] ? Object.values(seriesGroups[tier]) : [];
    const standaloneEntries = standaloneGroups[tier] || [];

    if (seriesEntries.length === 0 && standaloneEntries.length === 0) continue;

    html += `<div class="tier-section" data-tier="${tier}">`;
    // Tier header: stars + rating label
    html += `<div class="tier-head">`;
    html += `<div class="stars">${starRow(tier)}</div>`;
    html += `<span class="tier-label">${tier}.0</span>`;
    html += `</div>`;

    // Series group
    if (seriesEntries.length) {
      html += `<div class="group group-series">`;
      html += `<h3 class="group-label">Series</h3>`;
      seriesEntries.sort((a, b) => a.name.localeCompare(b.name));
      for (const s of seriesEntries) {
        const readCount = s.books.filter(b => b.status === "Finished" || b.status === "Ongoing" || b.status === "Currently Reading").length;
        const total = s.total || readCount;
        const progDots = renderProgressDots(s.status, readCount, total);
        const progLabel = total && total > readCount
          ? `<span class="progress-label">${readCount} of ${total}</span>`
          : `<span class="progress-label">${readCount} read so far</span>`;
        html += `<div class="series-list-item" data-series="${esc(s.name)}">`;
        html += `<details>`;
        html += `<summary>`;
        html += `<div class="item-row">`;
        html += `<span class="item-name">${CHEVRON}${esc(s.name)}</span>`;
        html += `<span class="item-status"><span class="dot-status ${statusDot(s.status)}"></span>${statusLabel(s.status)}</span>`;
        html += `</div>`;
        html += `</summary>`;
        // Book detail rows inside
        html += `<div class="book-detail">`;
        const sortedBooks = [...s.books].sort((a, b) => (a.bookNumber || 0) - (b.bookNumber || 0));
        for (const b of sortedBooks) {
          html += `<div class="book-row" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log">`;
          html += `<span class="book-title">${b.bookNumber ? b.bookNumber + ". " : ""}${esc(b.title)}</span>`;
          html += `<span class="book-meta">`;
          if (b.rating) html += `<span class="book-rating">★ ${b.rating.toFixed(1)}</span>`;
          if (b.dateRead) html += `<span>${b.dateRead}</span>`;
          html += `<button class="icon-btn edit-book" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log" title="Edit">${EDIT_ICON}</button>`;
          html += `</span>`;
          html += `</div>`;
        }
        html += `</div>`;
        html += `</details>`;
        html += `<div class="${progDots ? "progress" : ""}">${progDots}${progLabel}</div>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    // Standalones group
    if (standaloneEntries.length) {
      html += `<div class="group group-standalone">`;
      html += `<h3 class="group-label">Standalones</h3>`;
      standaloneEntries.sort((a, b) => a.title.localeCompare(b.title));
      for (const b of standaloneEntries) {
        html += `<div class="standalone-list-item" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log">`;
        html += `<details>`;
        html += `<summary>`;
        html += `<div class="item-row">`;
        html += `<span class="item-name">${CHEVRON}${esc(b.title)}</span>`;
        html += `<span class="item-status"></span>`;
        html += `</div>`;
        html += `</summary>`;
        html += `<div class="standalone-date"><span>Read ${b.dateRead || ""}</span><button class="icon-btn edit-book" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log" title="Edit">${EDIT_ICON}</button></div>`;
        html += `</details>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    html += `</div>`;
  }

  // Empty state
  if (!html) {
    html = `<div class="empty-state">No books logged yet.<br>Add your first book below.</div>`;
  }

  $("#homeContent").innerHTML = html;

  // Attach filter events
  $("#homeFilters").querySelectorAll(".filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      homeFilter = btn.dataset.filter;
      renderHome();
    });
  });

  // Attach edit events
  $("#homeContent").querySelectorAll(".edit-book").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.id;
      const parts = id.split("|");
      // parts: title|author|series|bookNumber|log
      const book = data.readingLog.find(b =>
        b.title === parts[0] && b.author === parts[1] &&
        b.series === parts[2] && (b.bookNumber || "") === (parts[3] || "")
      );
      if (book) openAddPanel("edit", book);
    });
  });

  // Expand/collapse — no extra work needed, <details> handles it
}

function renderLog() {
  let books = [...data.readingLog];
  if (logFilter !== "all") {
    books = books.filter(b => {
      if (logFilter === "all") return true;
      return b.status.toLowerCase() === logFilter;
    });
  }

  // Group by tier (rating), then series, then standalones
  const seriesGroups = {};
  const standaloneGroups = {};

  for (const b of books) {
    const tier = b.rating != null ? Math.round(b.rating * 2) / 2 : 0;
    if (b.series) {
      if (!seriesGroups[tier]) seriesGroups[tier] = {};
      if (!seriesGroups[tier][b.series]) {
        seriesGroups[tier][b.series] = { name: b.series, books: [] };
      }
      seriesGroups[tier][b.series].books.push(b);
    } else {
      if (!standaloneGroups[tier]) standaloneGroups[tier] = [];
      standaloneGroups[tier].push(b);
    }
  }

  // Compute series status and average
  const allTiers = new Set([...Object.keys(seriesGroups).map(Number), ...Object.keys(standaloneGroups).map(Number), 0]);
  const sortedTiers = [...allTiers].sort((a, b) => b - a).filter(t => t > 0);

  for (const tier of sortedTiers) {
    if (!seriesGroups[tier]) continue;
    for (const [name, s] of Object.entries(seriesGroups[tier])) {
      const statuses = s.books.map(b => b.status);
      const hasDropped = statuses.includes("Dropped");
      const hasOngoing = statuses.includes("Ongoing") || statuses.includes("Currently Reading");
      const hasPaused = statuses.includes("Paused");
      const hasFinished = statuses.includes("Finished");
      if (hasDropped) s.status = "Dropped";
      else if (hasOngoing) s.status = "Ongoing";
      else if (hasPaused) s.status = "Paused";
      else if (hasFinished && s.books.every(b => b.status === "Finished")) s.status = "Finished";
      else if (hasFinished) s.status = "Ongoing";
      else s.status = "Ongoing";

      const rated = s.books.filter(b => b.rating != null);
      s.avg = rated.length ? (rated.reduce((sum, b) => sum + b.rating, 0) / rated.length) : null;
    }
  }

  // Render
  let html = "";

  // Filter pills
  const statuses = ["all", "ongoing", "paused", "dropped", "finished"];
  html += `<div class="filters" id="logFilters">`;
  html += statuses.map(s =>
    `<button class="${logFilter === s ? "active" : ""}" data-filter="${s}">${s === "all" ? "All" : s.charAt(0).toUpperCase() + s.slice(1)}</button>`
  ).join("");
  html += `</div>`;

  for (const tier of sortedTiers) {
    const seriesEntries = seriesGroups[tier] ? Object.values(seriesGroups[tier]) : [];
    const standaloneEntries = standaloneGroups[tier] || [];

    if (seriesEntries.length === 0 && standaloneEntries.length === 0) continue;

    html += `<section class="tier" data-tier="${tier}">`;
    html += `<div class="tier-head">`;
    html += `<div class="stars">${starRow(tier)}</div>`;
    html += `<span class="tier-label">${ratingLabel(tier)}</span>`;
    html += `</div>`;

    if (seriesEntries.length) {
      html += `<div class="group group-series">`;
      html += `<h3 class="group-label">Series</h3>`;
      const ul = document.createElement("ul");
      ul.className = "series-list";
      // We'll build HTML string instead
      let serHtml = "";
      seriesEntries.sort((a, b) => a.name.localeCompare(b.name));
      for (const s of seriesEntries) {
        const readCount = s.books.filter(b => b.status === "Finished" || b.status === "Ongoing" || b.status === "Currently Reading").length;
        const total = Math.max(...s.books.map(b => b.bookNumber || 0)) || readCount;
        const progDots = renderProgressDots(s.status, readCount, total);
        const progLabel = total && total > readCount
          ? `<span class="progress-label">${readCount} of ${total}</span>`
          : `<span class="progress-label">${readCount} read so far</span>`;
        const bookRows = s.books.sort((a, b) => (a.bookNumber || 0) - (b.bookNumber || 0)).map(b => {
          return `<div class="book-row" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log">
            <span class="book-title">${b.bookNumber ? b.bookNumber + ". " : ""}${esc(b.title)}</span>
            <span class="book-meta">
              ${b.rating ? `<span class="book-rating">★ ${b.rating.toFixed(1)}</span>` : ""}
              ${b.dateRead ? `<span>${b.dateRead}</span>` : ""}
              <button class="icon-btn edit-book" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log" title="Edit">${EDIT_ICON}</button>
            </span>
          </div>`;
        }).join("");

        serHtml += `<li data-status="${s.status}">`;
        serHtml += `<details>`;
        serHtml += `<summary>`;
        serHtml += `<div class="item-row">`;
        serHtml += `<span class="item-name">${CHEVRON}${esc(s.name)}</span>`;
        serHtml += `<span class="item-status"><span class="dot-status ${statusDot(s.status)}"></span>${statusLabel(s.status)}</span>`;
        serHtml += `</div>`;
        serHtml += `</summary>`;
        serHtml += `<div class="book-detail">${bookRows}</div>`;
        serHtml += `<div class="progress">${progDots}${progLabel}</div>`;
        serHtml += `</details>`;
        serHtml += `</li>`;
      }
      html += serHtml;
      html += `</div>`;
    }

    if (standaloneEntries.length) {
      html += `<div class="group group-standalone">`;
      html += `<h3 class="group-label">Standalones</h3>`;
      standaloneEntries.sort((a, b) => a.title.localeCompare(b.title));
      for (const b of standaloneEntries) {
        html += `<li data-status="finished">`;
        html += `<details>`;
        html += `<summary>`;
        html += `<div class="item-row">`;
        html += `<span class="item-name">${CHEVRON}${esc(b.title)}</span>`;
        html += `<span class="item-status"></span>`;
        html += `</div>`;
        html += `</summary>`;
        html += `<div class="standalone-date"><span>Read ${b.dateRead || ""}</span><button class="icon-btn edit-book" data-id="${b.title}|${b.author}|${b.series || ""}|${b.bookNumber || ""}|log" title="Edit">${EDIT_ICON}</button></div>`;
        html += `</details>`;
        html += `</li>`;
      }
      html += `</div>`;
    }

    html += `</section>`;
  }

  if (!html) {
    html = `<div class="empty-state">No books with status "${logFilter}".</div>`;
  }

  $("#logContent").innerHTML = html;

  // Attach filter events
  $("#logFilters").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      logFilter = btn.dataset.filter;
      renderLog();
    });
  });

  // Attach edit events
  $("#logContent").querySelectorAll(".edit-book").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.id;
      const parts = id.split("|");
      const book = data.readingLog.find(b =>
        b.title === parts[0] && b.author === parts[1] &&
        b.series === parts[2] && (b.bookNumber || "") === (parts[3] || "")
      );
      if (book) openAddPanel("edit", book);
    });
  });

  applyLogFilter(logFilter);
}

function renderTBR() {
  let books = [...data.tbr];
  if (tbrFilter !== "all") {
    books = books.filter(b => (b.tbrPriority || b.status || "") === tbrFilter);
  }
  const priorityOrder = ["Priority 1", "Priority 2", "Priority 3", "Backburner", "Waiting for Release", "Currently Reading"];
  books.sort((a, b) => {
    const ai = priorityOrder.indexOf(a.tbrPriority || a.status || "");
    const bi = priorityOrder.indexOf(b.tbrPriority || b.status || "");
    return ai - bi;
  });

  $("#tbrContent").innerHTML = books.length
    ? `<div class="book-list">${books.map(b => bookEntryHTML(b, true)).join("")}</div>`
    : `<div class="empty-state">No books in TBR yet.</div>`;
}

function renderFilters() {
  const statuses = ["all", "Ongoing", "Finished", "Dropped", "Paused"];
  $("#logFilters").innerHTML = statuses.map(s =>
    `<button class="filter-chip ${logFilter === s ? "active" : ""}" data-filter="${s}">${s === "all" ? "All" : s}</button>`
  ).join("");

  const priorities = ["all", "Priority 1", "Priority 2", "Priority 3", "Backburner", "Waiting for Release"];
  $("#tbrFilters").innerHTML = priorities.map(s =>
    `<button class="filter-chip ${tbrFilter === s ? "active" : ""}" data-filter="${s}">${s === "all" ? "All" : s}</button>`
  ).join("");
}

function renderAll() {
  renderHome();
  renderLog();
  renderTBR();
  renderFilters();
  $("#logCount").textContent = data.readingLog.length;
  $("#tbrCount").textContent = data.tbr.length;
}

// ── API ──────────────────────────────────────────────────────────────────────
async function fetchFromCloud() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = JSON.parse(text);
    data = parsed;
    renderAll();
    return true;
  } catch (e) {
    console.error("Fetch failed:", e);
    $("#homeContent").innerHTML = `<div class="loading">Couldn't reach the cloud. Offline?<br>${e.message}</div>`;
    return false;
  }
}

async function pushToCloud(newData) {
  const b64 = btoa(JSON.stringify(newData));
  const res = await fetch(
    `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/data.json`,
    {
      method: "PUT",
      headers: {
        "Authorization": `token ${GH_TOKEN}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Data update ${new Date().toISOString().slice(0,10)}`,
        content: b64
      })
    }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return true;
}

async function sync() {
  $("#syncBtn").style.opacity = "0.5";
  const ok = await fetchFromCloud();
  $("#syncBtn").style.opacity = "1";
  if (ok) {
    $("#syncBtn").style.color = "var(--green)";
    setTimeout(() => $("#syncBtn").style.color = "", 1500);
  } else {
    $("#syncBtn").style.color = "var(--red)";
    setTimeout(() => $("#syncBtn").style.color = "", 1500);
  }
}

async function saveBook(bookObj) {
  if (editingMode === "edit-log") {
    const idx = data.readingLog.findIndex(b => b.title === editingBook.title);
    if (idx >= 0) data.readingLog[idx] = bookObj;
    editingBookKey = "readingLog";
  } else if (editingMode === "edit-tbr") {
    const idx = data.tbr.findIndex(b => b.title === editingBook.title);
    if (idx >= 0) data.tbr[idx] = bookObj;
    editingBookKey = "tbr";
  } else {
    // Adding new — defaults to readingLog
    data.readingLog.unshift(bookObj);
    editingBookKey = "readingLog";
  }

  try {
    await pushToCloud(data);
    renderAll();
    closeAddPanel();
  } catch (e) {
    alert("Save failed: " + e.message);
  }
}

async function deleteBook(bookKey, bookTitle) {
  if (!confirm("Delete this book entry?")) return;
  if (bookKey === "tbr") {
    data.tbr = data.tbr.filter(b => b.title !== bookTitle);
  } else {
    data.readingLog = data.readingLog.filter(b => b.title !== bookTitle);
  }
  try {
    await pushToCloud(data);
    renderAll();
    closeAddPanel();
  } catch (e) {
    alert("Delete failed: " + e.message);
  }
}

// ── Add book panel ───────────────────────────────────────────────────────────
function openAddPanel(mode="add", book=null) {
const panel = $("#addPanel");
panel.classList.remove("hidden");

if (mode === "edit" && book) {
  // Determine which array the book is in
  const tbrBook = data.tbr.find(b => b.title === book.title);
  if (tbrBook) {
    editingMode = "edit-tbr";
    editingBook = tbrBook;
    editingBookKey = "tbr";
  } else {
    editingMode = "edit-log";
    editingBook = book;
    editingBookKey = "readingLog";
  }
  $("#saveBookBtn").textContent = "Save Changes";
  $("#deleteBookBtn").classList.remove("hidden");
  $("#cancelAddBtn").textContent = "Cancel";
  $("#addTitle").value = book.title;
  $("#addAuthor").value = book.author || "";
  $("#addSeries").value = book.series || "";
  $("#addBookNum").value = book.bookNumber || "";
  $("#addRating").value = book.rating || "";
  $("#addStatus").value = book.status || "Ongoing";
  $("#addDate").value = book.dateRead || "";
  $("#addPriority").value = book.tbrPriority || "";
  highlightStars(book.rating);
} else {
  editingMode = "add";
  editingBook = null;
  editingBookKey = "readingLog";
  $("#saveBookBtn").textContent = "Add Book";
  $("#deleteBookBtn").classList.add("hidden");
  $("#cancelAddBtn").textContent = "Cancel";
  $("#addTitle").value = "";
  $("#addAuthor").value = "";
  $("#addSeries").value = "";
  $("#addBookNum").value = "";
  $("#addRating").value = "";
  $("#addStatus").value = "Ongoing";
  $("#addDate").value = new Date().toISOString().slice(0,10);
  $("#addPriority").value = "";
  clearStars();
}

// Show date field only for Finished/Currently Reading status
const showDate = $("#addStatus").value === "Finished" || $("#addStatus").value === "Currently Reading";
$("#addDate").style.display = showDate ? "" : "none";

// Move panel above the fab
panel.style.order = "5";
document.querySelector(".content").appendChild(panel);
panel.style.marginBottom = "90px";

$("#addTitle").focus();
}

function closeAddPanel() {
  $("#addPanel").classList.add("hidden");
  editingMode = null;
  editingBook = null;
  editingBookKey = null;
}

function highlightStars(rating) {
  // Reset all stars to empty
  $$(".star", $("#ratingStars")).forEach(el => {
    el.classList.remove("full", "half");
  });

  if (!rating) return;

  const stars = $$(".star", $("#ratingStars"));
  for (let i = 0; i < 5; i++) {
    const star = stars[i];
    const threshold = i + 1; // 1..5
    if (rating >= threshold) {
      star.classList.add("full");
    } else if (rating >= threshold - 0.5) {
      star.classList.add("half");
    }
    // else: stays empty (no class added)
  }
}

function clearStars() {
  $$(".star", $("#ratingStars")).forEach(el => {
    el.classList.remove("full", "half");
  });
}

// Star click handler — supports full and half stars.
// Each click on star N toggles: empty → full → half → empty
const ratingStarsEl = $("#ratingStars");
const staticStars = $$(".star", ratingStarsEl); // exactly 5 elements

staticStars.forEach((star, i) => {
  // Position value (1-indexed)
  const pos = i + 1;

  star.addEventListener("click", () => {
    const current = parseFloat($("#addRating").value || 0);
    let next;
    if (current === pos) {
      // full → half
      next = pos - 0.5;
    } else if (current === pos - 0.5) {
      // half → empty
      next = 0;
    } else {
      // empty (or lower) → full
      next = pos;
    }
    $("#addRating").value = String(next);
    highlightStars(next);
  });
});

// Status change → show/hide date
$("#addStatus").addEventListener("change", () => {
  $("#addDate").style.display = $("#addStatus").value === "Finished" ? "" : "none";
});

// ── Save / cancel ────────────────────────────────────────────────────────────
$("#saveBookBtn").addEventListener("click", () => {
  const title = $("#addTitle").value.trim();
  if (!title) { $("#addTitle").focus(); return; }

  const book = {
    title,
    author: $("#addAuthor").value.trim() || null,
    series: $("#addSeries").value.trim() || null,
    bookNumber: $("#addBookNum").value ? parseInt($("#addBookNum").value) : null,
    rating: $("#addRating").value ? parseFloat($("#addRating").value) : null,
    status: $("#addStatus").value,
    dateRead: $("#addDate").value || null,
    tbrPriority: $("#addPriority").value || null,
    lastUpdated: new Date().toISOString().slice(0,10)
  };

  saveBook(book);
});

$("#cancelAddBtn").addEventListener("click", closeAddPanel);
$( "#deleteBookBtn" ).addEventListener( "click", () => {
  if ( editingBook && editingBookKey ) {
    deleteBook( editingBookKey, editingBook.title );
  }
});

// ── Click book to edit ───────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const item = e.target.closest(".book-item");
  if (!item) return;

  // Find book data
  const id = item.dataset.id;
  let book = null;
  if (currentTab === "log") {
    book = data.readingLog.find(b =>
      b.title === id.split("|")[0] &&
      b.author === id.split("|")[1] &&
      b.series === id.split("|")[2] &&
      (b.bookNumber || "") === (id.split("|")[3] || "")
    );
    if (book) openAddPanel("edit", book);
  } else if (currentTab === "tbr") {
    const parts = id.split("|");
    // parts: [title, author, series, tbrPriority, "tbr"]
    book = data.tbr.find(b =>
      b.title === parts[0] &&
      b.author === parts[1] &&
      b.series === parts[2] &&
      (b.tbrPriority || b.status || "") === parts[3]
    );
    if (book) openAddPanel("edit", book);
  }
});

// ── Tab switching ────────────────────────────────────────────────────────────
$$(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    $$(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.tab;
    $$(".tab-panel").forEach(p => p.classList.remove("active"));
    $("#panel-" + currentTab).classList.add("active");
    // Update bottom nav
    $$(".bottom-nav-item").forEach(n => {
      n.classList.toggle("active", n.dataset.tab === currentTab);
    });
    // Re-render if needed
    if (currentTab === "log") renderLog();
    if (currentTab === "tbr") renderTBR();
    // Close add panel when switching tabs
    closeAddPanel();
  });
});

$$(".bottom-nav-item").forEach(n => {
  n.addEventListener("click", () => {
    const tab = $("#tabs").querySelector(`[data-tab="${n.dataset.tab}"]`);
    if (tab) tab.click();
  });
});

// ── Filters ──────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".filter-chip");
  if (!chip) return;
  const filter = chip.dataset.filter;
  if (chip.parentElement.id === "logFilters") {
    logFilter = filter;
    renderFilters();
    renderLog();
  } else if (chip.parentElement.id === "tbrFilters") {
    tbrFilter = filter;
    renderFilters();
    renderTBR();
  }
});

// ── FAB ──────────────────────────────────────────────────────────────────────
$("#addFab").addEventListener("click", () => openAddPanel("add"));

// ── Export ───────────────────────────────────────────────────────────────────
$("#exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `reading-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeAddPanel();
  if (e.key === "n" && !e.ctrlKey && !e.metaKey && $("#addPanel").classList.contains("hidden")) {
    openAddPanel("add");
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────
fetchFromCloud().then(ok => {
  if (!ok) {
    // Show a notice but still render empty panels
    renderAll();
    $("#homeContent").innerHTML =
      `<div class="empty-state">Offline — showing local data.<br><button class="btn btn-secondary" style="margin-top:12px;" id="retrySync">Retry sync</button></div>`;
    $("#retrySync").addEventListener("click", sync);
  }
});
</script>
</body>
</html>
